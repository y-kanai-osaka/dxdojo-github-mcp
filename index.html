<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #fff8e7;
      --card: #ffffff;
      --border: #ffd166;
      --text: #2d3748;
      --muted: #5f6b7a;
      --green: #16a34a;
      --blue: #2563eb;
    }
    body {
      background: linear-gradient(135deg, #fff8e7, #e0f7fa);
      color: var(--text);
    }
    .card {
      box-shadow: 0 12px 32px rgba(45, 55, 72, 0.12);
    }
    code {
      background: #fff3cd;
      color: #7c4a03;
    }
    .edit-me {
      background: #f0fdf4;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
